<div class="container my-5">

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow p-4">
        <h3 class="text-center mb-4 fw-bold">Contact Us</h3>

        <form>

          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="tel" class="form-control" placeholder="Enter your phone number">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Your Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
          </div>

          <button class="btn btn-primary w-100 py-2">Send Message</button>

        </form>
      </div>

    </div>
  </div>

</div>

<!-- interpolation -->
<h2 align="center">{{name}}</h2>

<!-- property binding -->
<img [src]="imgeUrl" alt="image"/>

<!-- Two-way databinding -->
 <br/>
 <br/>
 <!-- User Name: -->
 <input type="text" [(ngModel)]="username">
<p>abc:{{username}}</p>
